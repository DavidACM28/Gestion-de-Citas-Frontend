<main class="error-page">
  <mat-card class="error-card">
    <div class="error-card__icon error-card__icon--warning" aria-hidden="true">
      <mat-icon>lock</mat-icon>
    </div>
    <p class="error-card__code">Error 403</p>
    <h1>Acceso restringido</h1>
    <p>No tienes permisos para consultar esta sección del sistema.</p>
    <a mat-flat-button routerLink="/dashboard">
      <mat-icon>arrow_back</mat-icon>
      Volver al inicio
    </a>
  </mat-card>
</main>
